<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SalesVision Sync | Análise de Vendas Multiplataforma</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/idb-keyval@6/dist/idb-keyval-min.js"></script>
    <style>
        /* (Manter todos os estilos anteriores do CSS) */
        
        .sync-status {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background-color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            z-index: 100;
        }
        
        .sync-status .material-icons {
            font-size: 1rem;
        }
        
        .sync-status.syncing {
            color: var(--warning);
        }
        
        .sync-status.synced {
            color: var(--success);
        }
        
        .sync-status.error {
            color: var(--danger);
        }
    </style>
</head>
<body>
    <!-- (Manter toda a estrutura HTML anterior) -->

    <!-- Adicionar este elemento no final do body, antes dos scripts -->
    <div id="syncStatus" class="sync-status">
        <span class="material-icons">sync</span>
        <span>Conectando...</span>
    </div>

    <script>
        // Configuração do Sync Service
        const SYNC_API_URL = 'https://your-github-username.github.io/salesvision-sync/api';
        const SYNC_INTERVAL = 30000; // 30 segundos
        const DB_NAME = 'SalesVisionDB';
        const DB_VERSION = 1;
        
        // Variáveis globais
        let salesData = {};
        let currentWeek = '';
        let charts = {};
        let weeklyGoal = 0;
        let settings = {
            emailNotifications: 'weekly',
            syncEnabled: true
        };
        let db;
        let syncTimer;
        let deviceId = localStorage.getItem('deviceId') || generateDeviceId();

        // Gerar ID único para o dispositivo
        function generateDeviceId() {
            const id = 'dev-' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('deviceId', id);
            return id;
        }

        // Inicialização do IndexedDB
        async function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                
                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains('sales')) {
                        db.createObjectStore('sales', { keyPath: 'weekId' });
                    }
                    if (!db.objectStoreNames.contains('settings')) {
                        db.createObjectStore('settings');
                    }
                };
                
                request.onsuccess = (event) => {
                    db = event.target.result;
                    resolve(db);
                };
                
                request.onerror = (event) => {
                    console.error('IndexedDB error:', event.target.error);
                    reject(event.target.error);
                };
            });
        }

        // Carregar dados do IndexedDB
        async function loadData() {
            try {
                await initDB();
                
                // Carregar vendas
                const salesTransaction = db.transaction('sales', 'readonly');
                const salesStore = salesTransaction.objectStore('sales');
                const salesRequest = salesStore.getAll();
                
                const sales = await new Promise((resolve, reject) => {
                    salesRequest.onsuccess = () => resolve(salesRequest.result);
                    salesRequest.onerror = (e) => reject(e);
                });
                
                salesData = sales.reduce((acc, item) => {
                    acc[item.weekId] = item;
                    return acc;
                }, {});
                
                // Carregar configurações
                const settingsTransaction = db.transaction('settings', 'readonly');
                const settingsStore = settingsTransaction.objectStore('settings');
                const settingsRequest = settingsStore.get('settings');
                
                const savedSettings = await new Promise((resolve, reject) => {
                    settingsRequest.onsuccess = () => resolve(settingsRequest.result);
                    settingsRequest.onerror = (e) => reject(e);
                });
                
                if (savedSettings) {
                    settings = { ...settings, ...savedSettings };
                    document.getElementById('emailNotifications').value = settings.emailNotifications;
                }
                
                // Carregar meta
                const goalRequest = settingsStore.get('weeklyGoal');
                const savedGoal = await new Promise((resolve, reject) => {
                    goalRequest.onsuccess = () => resolve(goalRequest.result);
                    goalRequest.onerror = (e) => reject(e);
                });
                
                if (savedGoal) {
                    weeklyGoal = savedGoal;
                    document.getElementById('weeklyGoal').value = weeklyGoal;
                }
                
                // Se não houver semanas, cria uma semana padrão
                if (Object.keys(salesData).length === 0) {
                    const currentDate = new Date();
                    currentWeek = getWeekId(currentDate);
                    salesData[currentWeek] = createWeekData(currentDate, 0, 0);
                    await saveWeekToDB(salesData[currentWeek]);
                } else {
                    // Encontra a semana mais recente
                    const weeks = Object.keys(salesData).sort();
                    currentWeek = weeks[weeks.length - 1];
                }
                
                // Iniciar sincronização
                if (settings.syncEnabled) {
                    startSync();
                }
                
            } catch (error) {
                console.error('Error loading data:', error);
                showToast('Erro ao carregar dados', 'error');
            }
        }

        // Salvar semana no IndexedDB
        async function saveWeekToDB(weekData) {
            try {
                const transaction = db.transaction('sales', 'readwrite');
                const store = transaction.objectStore('sales');
                store.put(weekData);
                
                return new Promise((resolve, reject) => {
                    transaction.oncomplete = () => resolve();
                    transaction.onerror = (e) => reject(e);
                });
            } catch (error) {
                console.error('Error saving week:', error);
                throw error;
            }
        }

        // Salvar configurações no IndexedDB
        async function saveSettingsToDB() {
            try {
                const transaction = db.transaction('settings', 'readwrite');
                const store = transaction.objectStore('settings');
                store.put(settings, 'settings');
                store.put(weeklyGoal, 'weeklyGoal');
                
                return new Promise((resolve, reject) => {
                    transaction.oncomplete = () => resolve();
                    transaction.onerror = (e) => reject(e);
                });
            } catch (error) {
                console.error('Error saving settings:', error);
                throw error;
            }
        }

        // Sincronização com o "backend" (GitHub Pages)
        async function syncData() {
            if (!settings.syncEnabled) return;
            
            updateSyncStatus('Sincronizando...', 'syncing');
            
            try {
                // Obter último timestamp de sincronização
                const lastSync = await idbKeyval.get('lastSync') || 0;
                
                // Preparar dados para enviar
                const changes = {
                    deviceId,
                    lastSync,
                    sales: Object.values(salesData),
                    settings: {
                        weeklyGoal,
                        ...settings
                    },
                    timestamp: Date.now()
                };
                
                // Simular chamada à API (substitua por uma API real)
                const response = await mockApiCall(SYNC_API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(changes)
                });
                
                // Processar dados recebidos
                if (response && response.data) {
                    // Atualizar dados locais com as mudanças do servidor
                    for (const week of response.data.sales) {
                        if (!salesData[week.weekId] || new Date(week.updatedAt) > new Date(salesData[week.weekId]?.updatedAt || 0)) {
                            salesData[week.weekId] = week;
                            await saveWeekToDB(week);
                        }
                    }
                    
                    // Atualizar configurações
                    if (response.data.settings) {
                        settings = { ...settings, ...response.data.settings };
                        weeklyGoal = response.data.settings.weeklyGoal || weeklyGoal;
                        await saveSettingsToDB();
                    }
                    
                    // Atualizar UI
                    updateWeekSelector();
                    updateDashboard();
                    updateSalesTable();
                    
                    // Salvar último sync
                    await idbKeyval.set('lastSync', Date.now());
                    
                    updateSyncStatus('Sincronizado', 'synced');
                    setTimeout(() => updateSyncStatus('', ''), 3000);
                }
            } catch (error) {
                console.error('Sync error:', error);
                updateSyncStatus('Erro ao sincronizar', 'error');
                setTimeout(() => updateSyncStatus('', ''), 3000);
            }
        }

        // Mock da API (substitua por chamadas reais ao seu backend)
        async function mockApiCall(url, options) {
            // Em um cenário real, isso seria uma chamada fetch() para seu backend
            console.log('Mock API call:', url, options);
            
            // Simular atraso de rede
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            // Simular resposta do servidor
            return {
                status: 200,
                data: {
                    sales: Object.values(salesData),
                    settings: {
                        weeklyGoal,
                        ...settings
                    },
                    timestamp: Date.now()
                }
            };
        }

        // Iniciar sincronização periódica
        function startSync() {
            syncData(); // Sincronizar imediatamente
            syncTimer = setInterval(syncData, SYNC_INTERVAL);
        }

        // Parar sincronização
        function stopSync() {
            if (syncTimer) {
                clearInterval(syncTimer);
                syncTimer = null;
            }
        }

        // Atualizar status da sincronização
        function updateSyncStatus(message, status = '') {
            const element = document.getElementById('syncStatus');
            element.innerHTML = `<span class="material-icons">${status === 'synced' ? 'done' : 'sync'}</span>`;
            
            if (message) {
                element.innerHTML += `<span>${message}</span>`;
            }
            
            element.className = 'sync-status';
            if (status) {
                element.classList.add(status);
            }
        }

        // (Manter todas as outras funções anteriores, modificando para usar as funções async/await)

        // Modificar a função saveSettings para incluir a sincronização
        async function saveSettings() {
            const goalValue = parseFloat(document.getElementById('weeklyGoal').value);
            if (!isNaN(goalValue)) {
                weeklyGoal = goalValue;
            }
            
            settings.emailNotifications = document.getElementById('emailNotifications').value;
            settings.syncEnabled = document.getElementById('enableSync').checked;
            
            await saveSettingsToDB();
            updateDashboard();
            
            if (settings.syncEnabled) {
                startSync();
            } else {
                stopSync();
            }
            
            showToast('Configurações salvas com sucesso!');
        }

        // Modificar a função saveWeekData para incluir a sincronização
        async function saveWeekData() {
            // ... (código anterior)
            
            // Adiciona timestamp de atualização
            weekData.updatedAt = new Date().toISOString();
            weekData.deviceId = deviceId;
            
            salesData[weekId] = weekData;
            await saveWeekToDB(weekData);
            
            // Sincronizar imediatamente
            if (settings.syncEnabled) {
                await syncData();
            }
            
            // ... (código posterior)
        }

        // Inicialização
        document.addEventListener('DOMContentLoaded', async function() {
            await loadData();
            setupEventListeners();
            updateWeekSelector();
            updateDashboard();
            updateSalesTable();
            updateReportsTable();
            updateProductsTable();
            
            // Adicionar toggle de sincronização nas configurações
            const settingsForm = document.querySelector('#settings .chart-card:nth-child(2) .form-grid');
            settingsForm.innerHTML += `
                <div class="form-group">
                    <label class="form-label">Sincronização entre dispositivos</label>
                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                        <input type="checkbox" id="enableSync" ${settings.syncEnabled ? 'checked' : ''}>
                        <label for="enableSync">Ativar sincronização</label>
                    </div>
                    <p style="font-size: 0.75rem; color: var(--gray); margin-top: 0.5rem;">
                        Permite que seus dados sejam acessados em outros dispositivos
                    </p>
                </div>
            `;
            
            document.getElementById('enableSync').addEventListener('change', function() {
                settings.syncEnabled = this.checked;
                if (this.checked) {
                    startSync();
                } else {
                    stopSync();
                }
            });
        });

        // (Manter todas as outras funções auxiliares)
    </script>
</body>
</html>
